services:
  postgres:
    image: postgres:16-alpine
    container_name: aistudytwin_postgres
    restart: always
    environment:
      POSTGRES_DB: AiStudyTwinDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d AiStudyTwinDb"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aistudytwin_backend
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=AiStudyTwinDb;Username=postgres;Password=postgrespassword
      - Jwt__Key=AI_STUDY_TWIN_ULTRA_SECURE_JWT_SECRET_KEY_2026_SUPER_SAFE_LONG_KEY_FOR_HMAC_SHA256!
      - Jwt__Issuer=AiStudyTwin
      - Jwt__Audience=AiStudyTwinApp
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aistudytwin_frontend
    restart: always
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
